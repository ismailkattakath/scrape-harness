[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrape-harness"
version = "0.1.0"
description = "A generic, polite, typed scraping-pipeline core (extracted from listing-insights)."
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4",
  "rich",
  "jsonschema",
  "rfc3339-validator",
  "rfc3986-validator",
  "extruct",
  "playwright",
  "crawlee",
  "doit",
]

[project.scripts]
scrape-harness = "scrape_harness.cli:main"  # installed under pipeline.toml [consumer].cli by the flake

# Sources are provided by the consuming project (entry-point group "scrape_harness.sources") or
# registered in code with interfaces.register(); the core ships none.

# Fetch backends: each is a crawlee crawler. A page variant (variants.py) names which one it uses.
[project.entry-points."scrape_harness.drivers"]
impit-http = "scrape_harness.drivers.http:ImpitHttpBackend"
browser = "scrape_harness.drivers.browser:BrowserBackend"
fixture = "scrape_harness.drivers.fixture:FixtureBackend"


[tool.hatch.build.targets.wheel]
packages = ["src/scrape_harness"]

# ONE copy of the contracts: the repo's schemas/ directory is shipped inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "scrape_harness/schemas"

[tool.ruff]
extend-exclude = [".claude/statusline.py"]  # generated from src/scrape_harness/status.py (drift-tested)
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# ruff format owns line length; long string literals it cannot split are not a lint error.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# status.py is also rendered into .claude/statusline.py, run by the SYSTEM python3 (3.9 on macOS):
# pyupgrade rewrites (e.g. UP017 timezone.utc -> datetime.UTC, 3.11+) would break it.
"src/scrape_harness/status.py" = ["UP"]
