<script>
// a common lazy loader: IntersectionObserver + data-src, and a retry on error (twice)
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return; const im = e.target; io.unobserve(im); let tries = 0;
  im.onerror = () => { if (tries++ < 2) setTimeout(() => { im.src = im.dataset.src + "?retry=" + tries; }, 50); };
  im.src = im.dataset.src;
}), {rootMargin: "200px"});
document.querySelectorAll("img.lz").forEach(im => io.observe(im));
window.__probe = () => ({
  errored: [...document.images].filter(i => i.complete && i.naturalWidth === 0 && i.getAttribute("src")).length,
  height: document.body.scrollHeight,
});
</script></body></html>
